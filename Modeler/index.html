<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modeler</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1218; font-family: system-ui, Segoe UI, sans-serif; color: #dfe6f1; }
  canvas { display: block; }
  #panel { position: fixed; top: 14px; left: 14px; width: 310px; max-height: calc(100% - 28px); overflow-y: auto; padding: 14px 16px; background: rgba(20,25,35,.86); backdrop-filter: blur(8px); border: 1px solid #2a3344; border-radius: 12px; font-size: 13px; box-sizing: border-box; }
  #top { display: flex; gap: 6px; }
  #model { flex: 1; min-width: 0; background: #1b2436; color: #dfe6f1; border: 1px solid #34425f; border-radius: 8px; padding: 7px 8px; font-size: 14px; font-weight: 600; }
  #panel button { background: #243049; color: #dfe6f1; border: 1px solid #34425f; border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  #panel button:hover { background: #2f3f60; }
  #title { font-size: 16px; font-weight: 600; margin: 12px 0 2px; }
  #desc { opacity: .65; font-size: 12px; line-height: 1.5; }
  #panel { scrollbar-width: thin; scrollbar-color: #3a4a66 transparent; }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-track { background: transparent; margin: 10px 0; }
  #panel::-webkit-scrollbar-thumb { background: #3a4a66; border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
  #panel::-webkit-scrollbar-thumb:hover { background: #55698f; background-clip: padding-box; }
  #panel::-webkit-scrollbar-button { display: none; }
  #panel label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 2px; gap: 8px; }
  #panel input[type=range] { width: 100%; }
  #panel .row { display: flex; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
  #panel .row label { margin: 0; gap: 6px; }
  #panel .nv { display: flex; align-items: center; gap: 4px; }
  #panel input.num { width: 64px; background: #1b2436; color: #dfe6f1; border: 1px solid #34425f; border-radius: 6px; padding: 3px 5px; font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  #panel input.num:focus { outline: none; border-color: #6a8fd8; }
  #panel .u { opacity: .6; font-size: 11px; }
  #panel select.p { background: #1b2436; color: #dfe6f1; border: 1px solid #34425f; border-radius: 6px; padding: 3px; }
  h3 { margin: 14px 0 0; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; opacity: .5; font-weight: 600; }
  #btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  #dims { margin-top: 12px; border-top: 1px solid #2a3344; padding-top: 8px; font-size: 12px; line-height: 1.7; }
  #dims .ax { display: flex; gap: 6px; }
  #dims .ax i { font-style: normal; font-weight: 700; width: 14px; }
  #dims .ax span { margin-left: auto; font-variant-numeric: tabular-nums; }
  #err { display: none; margin-top: 10px; padding: 8px; border-radius: 8px; background: #3a1b22; border: 1px solid #7a2c3a; color: #ffb3c0; font: 11px/1.4 ui-monospace, Consolas, monospace; white-space: pre-wrap; }
  #list { margin-top: 6px; font-size: 12px; }
  #list .p { display: flex; align-items: center; gap: 7px; padding: 2px 4px 2px 38px; border-radius: 5px; }
  #list .p:hover { background: #263248; }
  #list .p.sel { background: #2f4468; }
  #list .p input { margin: 0; }
  #list i.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  #list .nm { flex: 1; min-width: 0; }
  #list .nm small { display: block; opacity: .5; font-size: 10.5px; }
  #list button { padding: 2px 7px; font-size: 10.5px; }
  #info { margin-top: 6px; font-size: 12px; line-height: 1.6; opacity: .85; }
  #sel { margin-top: 6px; font-size: 12px; line-height: 1.5; color: #9fd0ff; }
  #list .g { margin: 10px 0 3px; opacity: .9; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; font-size: 12.5px; display: flex; justify-content: flex-start; text-align: left; align-items: center; gap: 7px; padding: 0 4px 0 20px; cursor: pointer; }
  #list .g input { margin: 0; }
  #list .chev { position: absolute; margin-left: -16px; width: 14px; text-align: center; cursor: pointer; opacity: .8; user-select: none; }
  #list .g { position: relative; }
  #list .g.all .chev { display: none; }
  #list .g.all { margin-top: 0; padding-left: 4px; }
  #busy { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(15,18,24,.88); font-size: 15px; z-index: 4; }
  #notes { margin-top: 8px; font-size: 12px; opacity: .7; line-height: 1.5; }
  #hint { position: fixed; bottom: 12px; right: 16px; font-size: 12px; opacity: .6; }
  #nofile { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; background: #0f1218; z-index: 5; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<div id="busy">Building model&hellip;</div>
<div id="nofile">Models cannot load when index.html is opened as a file.<br>Double-click <b>start.bat</b> in the Modeler folder (or run <code>node server.mjs</code>),<br>then use <b>http://localhost:5174</b></div>
<div id="panel">
  <div id="top">
    <select id="model"></select>
    <button id="refresh" title="Rescan the models folder">&#8635;</button>
  </div>
  <div id="title"></div>
  <div id="desc"></div>
  <div id="err"></div>
  <div id="params"></div>
  <h3>View</h3>
  <div id="opRow">
    <label>Shell opacity <span id="opv">35%</span></label>
    <input id="opacity" type="range" min="0" max="100" value="35">
  </div>
  <div id="asmRow" style="display:none">
    <label>Card &rarr; assembled <span id="asv">100%</span></label>
    <input id="assemble" type="range" min="0" max="100" value="100">
  </div>
  <label>Exploded view <span id="exv">0%</span></label>
  <input id="explode" type="range" min="0" max="100" value="0">
  <div class="row">
    <label id="cutRow"><input id="cut" type="checkbox">Cut-away</label>
    <label><input id="spin" type="checkbox">Auto-rotate</label>
    <label><input id="scale" type="checkbox" checked>Rulers</label>
  </div>
  <div class="row" id="toggles"></div>
  <div id="btns">
    <button data-view="iso">Iso</button>
    <button data-view="front">Front</button>
    <button data-view="side">Side</button>
    <button data-view="top">Top</button>
    <button id="bCard" style="display:none">Card view</button>
    <button id="bAsm" style="display:none">Assemble</button>
  </div>
  <h3>Export</h3>
  <div id="btns">
    <button id="bPlate3mf">Print plate 3MF</button>
    <button id="bAsm3mf">Assembled 3MF</button>
    <span id="modelExports" style="display:contents"></span>
  </div>
  <div id="dims"></div>
  <div id="info"></div>
  <div id="sel"></div>
  <h3>Parts</h3>
  <div id="list"></div>
  <div id="notes"></div>
</div>
<div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>

<script>if (location.protocol === "file:") { document.addEventListener("DOMContentLoaded", function () { document.getElementById("nofile").style.display = "flex"; }); }</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.0/build/index.module.js",
  "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"
} }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
