<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Bot 3D Model</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1218; font-family: system-ui, Segoe UI, sans-serif; color: #dfe6f1; }
  canvas { display: block; }
  #panel { position: fixed; top: 14px; left: 14px; width: 270px; padding: 14px 16px; background: rgba(20,25,35,.82); backdrop-filter: blur(8px); border: 1px solid #2a3344; border-radius: 12px; font-size: 13px; }
  #panel h1 { font-size: 16px; margin: 0 0 10px; }
  #panel label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 2px; }
  #panel input[type=range] { width: 100%; }
  #panel .row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  #legend { margin-top: 12px; border-top: 1px solid #2a3344; padding-top: 8px; font-size: 12px; line-height: 1.7; }
  #legend div { display: flex; align-items: center; gap: 8px; }
  #legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  #hint { position: fixed; bottom: 12px; right: 16px; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="panel">
  <h1>Desk Bot &middot; 60 mm rounded cube</h1>
  <label>Shell opacity <span id="opv">35%</span></label>
  <input id="opacity" type="range" min="0" max="100" value="35">
  <label>Exploded view <span id="exv">0%</span></label>
  <input id="explode" type="range" min="0" max="100" value="0">
  <div class="row">
    <label style="margin:0"><input id="cut" type="checkbox">&nbsp;Cut-away</label>
    <label style="margin:0"><input id="vib" type="checkbox">&nbsp;Vibrate</label>
    <label style="margin:0"><input id="spin" type="checkbox">&nbsp;Auto-rotate</label>
  </div>
  <div id="legend"></div>
</div>
<div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.0/build/index.module.js",
  "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"
} }
</script>



<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Brush, Evaluator, SUBTRACTION } from 'three-bvh-csg';

const SIZE = 60;
const WALL = 2.2;
const RADIUS = 8;
const LIFT = 0.4;
const HALF = SIZE / 2;
const INNER_FRONT = HALF - WALL;
const INNER_BACK = -HALF + WALL;
const INNER_TOP = SIZE - WALL;
const INNER_FLOOR = WALL;
const OPENING = 40;
const OPENING_R = 4;
const GAP = 0.2;
const ESP_X = -12.2;
const ESP_Z = -17;
const ESP_Y = 28.6;
const USB_Z = ESP_Z + 2.2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1218);
scene.fog = new THREE.Fog(0x0f1218, 250, 600);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 2000);
camera.position.set(100, 80, 125);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 30, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.499;
controls.minDistance = 50;
controls.maxDistance = 400;
controls.autoRotateSpeed = 1.5;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(80, 160, 100);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -120;
key.shadow.camera.right = 120;
key.shadow.camera.top = 120;
key.shadow.camera.bottom = -120;
key.shadow.camera.far = 500;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7aa7ff, 1.0);
rim.position.set(-120, 60, -100);
scene.add(rim);

const desk = new THREE.Mesh(
  new THREE.PlaneGeometry(1200, 1200),
  new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 0.85, metalness: 0.05 })
);
desk.rotation.x = -Math.PI / 2;
desk.receiveShadow = true;
scene.add(desk);
const grid = new THREE.GridHelper(400, 40, 0x2c3650, 0x1d2536);
grid.position.y = 0.02;
scene.add(grid);

const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
const clipMats = new Set();
function track(mat) { clipMats.add(mat); return mat; }
function applyClip(on) {
  for (const mat of clipMats) {
    mat.clippingPlanes = on ? [clipPlane] : [];
    mat.needsUpdate = true;
  }
}

const bot = new THREE.Group();
scene.add(bot);

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function slab(w, h, d, r, mat) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), { depth: d, bevelEnabled: false, curveSegments: 6 });
  geo.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

function pcb(color) {
  return track(new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.2 }));
}
const metal = track(new THREE.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.3, metalness: 0.95 }));
const black = track(new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.5, metalness: 0.2 }));

const shellMat = track(new THREE.MeshPhysicalMaterial({
  color: 0xf2f4f8, roughness: 0.35, metalness: 0.0, clearcoat: 0.8, clearcoatRoughness: 0.25,
  transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false
}));
const lidMat = track(new THREE.MeshPhysicalMaterial({
  color: 0xf2f4f8, roughness: 0.35, metalness: 0.0, clearcoat: 0.8, clearcoatRoughness: 0.25,
  transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false
}));
const fadeMats = [shellMat, lidMat];

function cutter(shape, depth) {
  return new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 8 });
}

function buildShellGeometry() {
  const evaluator = new Evaluator();
  evaluator.useGroups = false;
  const make = geo => { const b = new Brush(geo, shellMat); b.updateMatrixWorld(); return b; };

  const outer = make(new RoundedBoxGeometry(SIZE, SIZE, SIZE, 10, RADIUS));
  const cavity = make(new RoundedBoxGeometry(SIZE - WALL * 2, SIZE - WALL * 2, SIZE - WALL * 2, 10, RADIUS - WALL));

  const backGeo = cutter(roundedRectShape(OPENING, OPENING, OPENING_R), 6);
  backGeo.translate(0, 0, -HALF - 3);
  const backHole = make(backGeo);

  const usbGeo = cutter(roundedRectShape(10, 4.4, 1.4), 6);
  usbGeo.translate(0, 0, -3);
  usbGeo.rotateX(-Math.PI / 2);
  usbGeo.translate(ESP_X, -HALF + 3 - 0.01, USB_Z);
  const usbHole = make(usbGeo);

  let result = evaluator.evaluate(outer, cavity, SUBTRACTION);
  result = evaluator.evaluate(result, backHole, SUBTRACTION);
  result = evaluator.evaluate(result, usbHole, SUBTRACTION);
  return result.geometry;
}

const shell = new THREE.Group();
shell.position.y = LIFT;
const shellMesh = new THREE.Mesh(buildShellGeometry(), shellMat);
shellMesh.position.y = HALF;
shellMesh.castShadow = true;
shell.add(shellMesh);
bot.add(shell);

const lid = new THREE.Group();
{
  const plateSize = OPENING - GAP * 2;
  const plate = slab(plateSize, plateSize, WALL, OPENING_R - GAP, lidMat);
  plate.position.set(0, LIFT + HALF, -HALF + WALL / 2);
  lid.add(plate);
}

const decalMats = {
  port: track(new THREE.MeshStandardMaterial({ color: 0x0a0b0d, roughness: 0.8 })),
  bezel: track(new THREE.MeshStandardMaterial({ color: 0x0a0c10, roughness: 0.3, metalness: 0.2 }))
};
const decals = new THREE.Group();
decals.position.y = LIFT;
bot.add(decals);

const tabMat = track(new THREE.MeshStandardMaterial({ color: 0xdfe3ea, roughness: 0.5, metalness: 0.05 }));
const HOLE_EDGE = OPENING / 2;
const TAB_R = HOLE_EDGE - GAP - 0.7;
const TAB_ZR = -HALF + WALL - 0.2;
const TAB_ZE = INNER_BACK + 5;
const TAB_ZC = (TAB_ZR + TAB_ZE) / 2;
const TAB_LEN = TAB_ZE - TAB_ZR;
const HOOK_Z = TAB_ZE - 1.0;
const BLOCK_ZC = INNER_BACK + 1.4;
function addTab(axis, sign, offset) {
  const horizontal = axis === 'x';
  const cy = LIFT + HALF;
  const dims = (a, b, c) => (horizontal ? [a, b, c] : [b, a, c]);
  const place = (mesh, radial, z, yBase) => {
    if (horizontal) mesh.position.set(sign * radial, yBase, z);
    else mesh.position.set(offset, yBase + sign * radial, z);
  };
  const plate = new THREE.Mesh(new THREE.BoxGeometry(...dims(1.2, 10, TAB_LEN)), tabMat);
  place(plate, TAB_R, TAB_ZC, cy);
  const hook = new THREE.Mesh(new THREE.BoxGeometry(...dims(1.0, 8, 1.6)), tabMat);
  place(hook, HOLE_EDGE + 0.1, HOOK_Z, cy);
  plate.castShadow = hook.castShadow = true;
  lid.add(plate, hook);
  const block = new THREE.Mesh(new THREE.BoxGeometry(...dims(1.5, 9, 2.8)), tabMat);
  place(block, HOLE_EDGE + 0.75, BLOCK_ZC, HALF);
  block.castShadow = true;
  decals.add(block);
}
addTab('x', -1, 0);
addTab('x', 1, 0);
addTab('y', 1, 0);
addTab('y', -1, -10);

const parts = [];
const legend = document.getElementById('legend');
function addPart(name, dims, color, group, basePos, explode) {
  group.position.copy(basePos);
  bot.add(group);
  parts.push({ name, group, base: basePos.clone(), explode: explode.clone(), jitter: name === 'Vibration module' });
  const row = document.createElement('div');
  row.innerHTML = `<i style="background:#${color.toString(16).padStart(6, '0')}"></i><span>${name} <b style="opacity:.6;font-weight:400">${dims}</b></span>`;
  legend.appendChild(row);
}

const FLOOR_Y = INNER_FLOOR + LIFT + 0.4;
const vibGroup = new THREE.Group();
{
  const padMat = track(new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.6, metalness: 0.1 }));
  const pad = slab(23, 21, FLOOR_Y, 3, padMat);
  pad.rotation.x = Math.PI / 2;
  pad.position.y = FLOOR_Y / 2;
  const body = slab(23, 21, 5, 3, pcb(0x1c6b5a));
  body.rotation.x = Math.PI / 2;
  body.position.y = FLOOR_Y + 2.5;
  const motor = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 7, 32), metal);
  motor.rotation.z = Math.PI / 2;
  motor.position.set(0, FLOOR_Y + 5 + 4, 0);
  motor.castShadow = true;
  vibGroup.add(pad, body, motor);
}
addPart('Vibration module', '23 × 21 mm', 0xff7a1a, vibGroup, new THREE.Vector3(0, 0, 0), new THREE.Vector3(30, 0, 0));

const CHARGER_X = 14.8;
const CHARGER_Y = 11.2;
const chargerGroup = new THREE.Group();
{
  const board = slab(25, 17, 1.6, 1.5, pcb(0x1f3f8a));
  board.rotation.x = Math.PI / 2;
  board.position.y = 0.8;
  const port = new THREE.Mesh(new RoundedBoxGeometry(9, 3.2, 7.5, 3, 0.9), metal);
  port.position.set(0, 1.6 + 1.6, -17 / 2 + 3.2);
  port.castShadow = true;
  const chip = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 5), black);
  chip.position.set(6, 2.1, 2.5);
  chargerGroup.add(board, port, chip);
  for (const sx of [-9, 9]) {
    for (const sz of [-5.5, 5.5]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 8, 16), tabMat);
      post.position.set(sx, -4, sz);
      chargerGroup.add(post);
    }
  }
}
addPart('C-type charging module', '25 × 17 mm', 0x1f3f8a, chargerGroup, new THREE.Vector3(CHARGER_X, CHARGER_Y, INNER_BACK + 17 / 2 + 0.8), new THREE.Vector3(18, 0, -12));

const batteryGroup = new THREE.Group();
{
  const body = slab(25, 44, 10, 2.5, track(new THREE.MeshStandardMaterial({ color: 0x4b6fd1, roughness: 0.4, metalness: 0.3 })));
  const tab = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 1.2), black);
  tab.position.set(0, -24, 0);
  batteryGroup.add(body, tab);
}
addPart('Battery', '25 × 44 × 10 mm', 0x4b6fd1, batteryGroup, new THREE.Vector3(0, LIFT + 31, 20.6), new THREE.Vector3(0, 0, 18));

const accelGroup = new THREE.Group();
{
  const board = slab(20, 15, 1.6, 1.5, pcb(0x7a2fb0));
  const chip = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 1), black);
  chip.position.set(0, 0, 1.3);
  const pins = new THREE.Mesh(new THREE.BoxGeometry(14, 2.5, 2.5), black);
  pins.position.set(0, -5, -1.5);
  accelGroup.add(board, chip, pins);
}
addPart('Accelerometer', '20 × 15 mm', 0x7a2fb0, accelGroup, new THREE.Vector3(0, LIFT + 34, 0), new THREE.Vector3(0, 8, 0));

const espGroup = new THREE.Group();
{
  const board = slab(28.5, 51.5, 1.6, 1.5, pcb(0x14171f));
  const can = new THREE.Mesh(new THREE.BoxGeometry(18, 25.5, 3), metal);
  can.position.set(0, 12, 2.3);
  can.castShadow = true;
  const ant = new THREE.Mesh(new THREE.BoxGeometry(18, 10, 0.3), track(new THREE.MeshStandardMaterial({ color: 0xd2a640, metalness: 0.8, roughness: 0.4 })));
  ant.position.set(0, 20.5, 0.9);
  const usb = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 2.8), metal);
  usb.position.set(0, -24.5, 2.2);
  espGroup.add(board, can, usb);
  const pinsMat = track(new THREE.MeshStandardMaterial({ color: 0xd9b45a, metalness: 0.9, roughness: 0.35 }));
  for (const sx of [-1, 1]) {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(2.5, 44, 2.5), black);
    strip.position.set(sx * 12.6, -2, -1.6);
    const gold = new THREE.Mesh(new THREE.BoxGeometry(0.7, 44, 0.7), pinsMat);
    gold.position.set(sx * 12.6, -2, -3.1);
    espGroup.add(strip, gold);
  }
}
addPart('ESP32 module', '28.5 × 51.5 mm', 0x3a3f4d, espGroup, new THREE.Vector3(ESP_X, LIFT + ESP_Y, ESP_Z), new THREE.Vector3(-14, 6, -6));

const screenCanvas = document.createElement('canvas');
screenCanvas.width = 700;
screenCanvas.height = 370;
const sctx = screenCanvas.getContext('2d');
const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.anisotropy = 8;

function drawFace(t) {
  const w = screenCanvas.width, h = screenCanvas.height;
  sctx.fillStyle = '#04080c';
  sctx.fillRect(0, 0, w, h);
  const blink = (t % 4) > 3.85 ? 0.12 : 1;
  const look = Math.sin(t * 0.8) * 14;
  sctx.fillStyle = '#4ff0ff';
  sctx.shadowColor = '#4ff0ff';
  sctx.shadowBlur = 24;
  for (const ex of [w * 0.3, w * 0.7]) {
    const ew = 100, eh = 130 * blink;
    sctx.beginPath();
    sctx.roundRect(ex - ew / 2 + look, h * 0.45 - eh / 2, ew, eh, 34);
    sctx.fill();
  }
  sctx.shadowBlur = 0;
  screenTex.needsUpdate = true;
}
drawFace(0);

const SCREEN_Y = 36;
const screenGroup = new THREE.Group();
const displayMat = track(new THREE.MeshBasicMaterial({ map: screenTex }));
{
  const board = slab(35, 32.2, 1.6, 2, pcb(0x101216));
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(35, 18.5), displayMat);
  glass.position.set(0, 3.5, 0.85);
  const flex = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 0.4), track(new THREE.MeshStandardMaterial({ color: 0xc78a2c, roughness: 0.6 })));
  flex.position.set(0, -17.5, -0.8);
  screenGroup.add(board, glass, flex);
}
addPart('Screen module', '35 × 32.2 mm (display 35 × 18.5)', 0x4ff0ff, screenGroup, new THREE.Vector3(0, LIFT + SCREEN_Y, INNER_FRONT - 0.9), new THREE.Vector3(0, 0, 38));

for (const sx of [-1, 1]) {
  const g = new THREE.Group();
  const board = slab(10.7, 14, 1.4, 1.5, pcb(0xd9a21c));
  board.rotation.x = Math.PI / 2;
  const chip = new THREE.Mesh(new THREE.BoxGeometry(3, 0.6, 3), black);
  chip.position.y = -0.9;
  g.add(board, chip);
  addPart(sx < 0 ? 'Touch module L' : 'Touch module R', '10.7 × 14 mm', 0xd9a21c, g, new THREE.Vector3(sx * 13, INNER_TOP + LIFT - 0.7, 0), new THREE.Vector3(sx * 12, 22, 0));
}

addPart('Snap-fit back panel', '4 flex tabs + catches', 0xdfe3ea, lid, new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -30));

{
  const bezel = slab(38, 22.5, 0.5, 3, decalMats.bezel);
  bezel.position.set(0, SCREEN_Y + 3.5, HALF + 0.05);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(35, 18.5), displayMat);
  glass.position.set(0, SCREEN_Y + 3.5, HALF + 0.32);
  decals.add(bezel, glass);
}
{
  const port = slab(9.6, 3.6, 0.4, 1.4, decalMats.port);
  port.position.set(CHARGER_X, CHARGER_Y + 3.2, -HALF - 0.05);
  lid.add(port);
}

const opacity = document.getElementById('opacity');
const explode = document.getElementById('explode');
const cut = document.getElementById('cut');
const vib = document.getElementById('vib');
const spin = document.getElementById('spin');
const opv = document.getElementById('opv');
const exv = document.getElementById('exv');

function applyOpacity() {
  const v = opacity.value / 100;
  opv.textContent = opacity.value + '%';
  const solid = v >= 0.999;
  for (const m of fadeMats) {
    m.opacity = v;
    m.transparent = !solid;
    m.depthWrite = solid;
    m.needsUpdate = true;
  }
}
applyOpacity();
applyClip(false);
opacity.addEventListener('input', applyOpacity);
explode.addEventListener('input', () => { exv.textContent = explode.value + '%'; });
cut.addEventListener('change', () => applyClip(cut.checked));
spin.addEventListener('change', () => { controls.autoRotate = spin.checked; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  const e = explode.value / 100;
  const sh = vib.checked ? 0.12 : 0;
  const sx = Math.sin(t * 90) * sh;
  const sz = Math.cos(t * 83) * sh;
  for (const p of parts) {
    p.group.position.copy(p.base).addScaledVector(p.explode, e);
    if (p.jitter && vib.checked) {
      p.group.position.x += Math.sin(t * 90) * 0.18;
      p.group.position.z += Math.cos(t * 83) * 0.18;
    }
  }
  lid.position.x += sx;
  lid.position.z += sz;
  shell.position.set(sx, LIFT, sz);
  decals.position.set(sx, LIFT, sz);
  drawFace(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
