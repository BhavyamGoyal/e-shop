<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desk Bot Full Body</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1218; font-family: system-ui, Segoe UI, sans-serif; color: #dfe6f1; }
  canvas { display: block; }
  #panel { position: fixed; top: 14px; left: 14px; width: 270px; padding: 14px 16px; background: rgba(20,25,35,.82); backdrop-filter: blur(8px); border: 1px solid #2a3344; border-radius: 12px; font-size: 13px; }
  #panel h1 { font-size: 16px; margin: 0 0 10px; }
  #panel label { display: flex; justify-content: space-between; align-items: center; margin: 8px 0 2px; }
  #panel input[type=range] { width: 100%; }
  #panel .row { display: flex; gap: 14px; margin-top: 10px; flex-wrap: wrap; }
  #legend { margin-top: 12px; border-top: 1px solid #2a3344; padding-top: 8px; font-size: 12px; line-height: 1.7; }
  #legend div { display: flex; align-items: center; gap: 8px; }
  #legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
  #hint { position: fixed; bottom: 12px; right: 16px; font-size: 12px; opacity: .6; }
</style>
</head>
<body>
<div id="panel">
  <h1>Desk Bot &middot; full body</h1>
  <label>Shell opacity <span id="opv">35%</span></label>
  <input id="opacity" type="range" min="0" max="100" value="35">
  <label>Exploded view <span id="exv">0%</span></label>
  <input id="explode" type="range" min="0" max="100" value="0">
  <div class="row">
    <label style="margin:0"><input id="cut" type="checkbox">&nbsp;Cut-away</label>
    <label style="margin:0"><input id="vib" type="checkbox">&nbsp;Vibrate</label>
    <label style="margin:0"><input id="spin" type="checkbox">&nbsp;Auto-rotate</label>
    <label style="margin:0"><input id="wires" type="checkbox" checked>&nbsp;Wiring</label>
  </div>
  <div id="legend"></div>
</div>
<div id="hint">Drag to orbit &middot; scroll to zoom &middot; right-drag to pan</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.0/build/index.module.js",
  "three-bvh-csg": "https://cdn.jsdelivr.net/npm/three-bvh-csg@0.0.16/build/index.module.js"
} }
</script>



<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Brush, Evaluator, SUBTRACTION, INTERSECTION } from 'three-bvh-csg';

const WALL = 2.2;
const HW = 60, HH = 40, HD = 60, HR = 8;
const HEAD_CY = 66;
const TW = 40, TH = 25, TD = 38, TR = 5;
const T_OPEN_W = 26, T_OPEN_H = 11.5, T_OPEN_R = 3;
const TORSO_Y = 17;
const FW = 26, FH = 17, FD = 44, FR = 6;
const FOOT_X = 17;
const SOLE = 3;
const LIP_Z = 16;
const PASS_X = 12.5;
const PASS_R = 2.8;
const OPEN_W = 40, OPEN_H = 20, OPEN_R = 4;
const GAP = 0.2;
const FRONT_IN = HD / 2 - WALL;
const BACK_IN = -HD / 2 + WALL;
const SCREEN_DY = -1.5;
const WINDOW_DY = SCREEN_DY + 3.5;
const ESP_X = -13.2;
const ESP_DY = -8;
const ESP_Z = -0.15;
const BAT_X = 14.5;
const BAT_DY = -12.8;
const BAT_Z = 3.6;
const CHARGER_Y = 6.5;
const CHARGER_Z = -6.5;
const PORT_Y = CHARGER_Y + 3.2;
const TORSO_CY = TORSO_Y + TH / 2;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1218);
scene.fog = new THREE.Fog(0x0f1218, 300, 700);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 1, 2500);
camera.position.set(150, 110, 210);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 48, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.499;
controls.minDistance = 60;
controls.maxDistance = 600;
controls.autoRotateSpeed = 1.5;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(100, 220, 140);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -160;
key.shadow.camera.right = 160;
key.shadow.camera.top = 160;
key.shadow.camera.bottom = -160;
key.shadow.camera.far = 600;
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0x7aa7ff, 1.0);
rim.position.set(-150, 90, -120);
scene.add(rim);

const desk = new THREE.Mesh(
  new THREE.PlaneGeometry(1600, 1600),
  new THREE.MeshStandardMaterial({ color: 0x1a2030, roughness: 0.85, metalness: 0.05 })
);
desk.rotation.x = -Math.PI / 2;
desk.receiveShadow = true;
scene.add(desk);
const grid = new THREE.GridHelper(500, 50, 0x2c3650, 0x1d2536);
grid.position.y = 0.02;
scene.add(grid);

const clipPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 0);
const clipMats = new Set();
function track(mat) { clipMats.add(mat); return mat; }
function applyClip(on) {
  for (const mat of clipMats) {
    mat.clippingPlanes = on ? [clipPlane] : [];
    mat.needsUpdate = true;
  }
}

const bot = new THREE.Group();
scene.add(bot);

function roundedRectShape(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  return s;
}

function slab(w, h, d, r, mat) {
  const geo = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), { depth: d, bevelEnabled: false, curveSegments: 6 });
  geo.translate(0, 0, -d / 2);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = true;
  return m;
}

function cutter(w, h, r, depth, z0) {
  const g = new THREE.ExtrudeGeometry(roundedRectShape(w, h, r), { depth, bevelEnabled: false, curveSegments: 8 });
  g.translate(0, 0, z0);
  return g;
}

function plainBox(w, h, d, x, y, z) {
  return new THREE.BoxGeometry(w, h, d).translate(x, y, z);
}

const evaluator = new Evaluator();
evaluator.useGroups = false;
const csgMat = new THREE.MeshBasicMaterial();
function brush(geo) {
  const b = new Brush(geo, csgMat);
  b.updateMatrixWorld();
  return b;
}
function sub(a, geo) { return evaluator.evaluate(a, brush(geo), SUBTRACTION); }
function inter(a, geo) { return evaluator.evaluate(a, brush(geo), INTERSECTION); }

function columnOuter(w, h, d, r) {
  const full = brush(new RoundedBoxGeometry(w, h * 2, d, 12, r));
  return inter(full, plainBox(w + 2, h, d + 2, 0, h / 2, 0));
}

function buildHead() {
  let r = brush(new RoundedBoxGeometry(HW, HH, HD, 12, HR));
  r = sub(r, new RoundedBoxGeometry(HW - WALL * 2, HH - WALL * 2, HD - WALL * 2, 12, HR - WALL));
  r = sub(r, cutter(OPEN_W, OPEN_H, OPEN_R, 6, -HD / 2 - 3));
  r = sub(r, cutter(35.2, 18.7, 1.2, 6, FRONT_IN - 1.5).translate(0, WINDOW_DY, 0));
  r = sub(r, new THREE.CylinderGeometry(5, 5, 10, 40).translate(0, -HH / 2, 0));
  return r.geometry;
}

function buildCap(depth, openW, openH, openR, slot) {
  const plate = cutter(openW - GAP * 2, openH - GAP * 2, openR - GAP, WALL, -depth / 2);
  let r = brush(plate);
  if (slot) r = sub(r, cutter(10, 4.4, 1.4, 6, -depth / 2 - 3).translate(slot[0], slot[1], 0));
  return r.geometry;
}

function buildTorso() {
  let r = brush(new RoundedBoxGeometry(TW, TH, TD, 12, TR));
  r = sub(r, new RoundedBoxGeometry(TW - WALL * 2, TH - WALL * 2, TD - WALL * 2, 12, TR - WALL));
  r = sub(r, cutter(T_OPEN_W, T_OPEN_H, T_OPEN_R, 6, -TD / 2 - 3));
  r = sub(r, new THREE.CylinderGeometry(5, 5, 10, 40).translate(0, TH / 2, 0));
  for (const px of [-PASS_X, PASS_X]) r = sub(r, new THREE.CylinderGeometry(PASS_R, PASS_R, 10, 32).translate(px, -TH / 2, 0));
  return r.geometry;
}

function buildFoot(sx) {
  const withPort = sx > 0;
  const withWindow = sx < 0;
  const outer = columnOuter(FW, FH, FD, FR);
  let upper = inter(outer, plainBox(FW + 2, FH - SOLE, FD + 2, 0, SOLE + (FH - SOLE) / 2, 0));
  upper = sub(upper, new RoundedBoxGeometry(FW - WALL * 2, (FH - WALL) * 2, FD - WALL * 2, 12, FR - WALL));
  if (withPort) upper = sub(upper, cutter(9.2, 3.8, 1.4, 6, -FD / 2 - 3).translate(0, PORT_Y, 0));
  upper = sub(upper, new THREE.CylinderGeometry(PASS_R, PASS_R, 10, 32).translate(-sx * (FOOT_X - PASS_X), FH, 0));
  for (const gx of [-1, 1]) {
    for (const gz of [-1, 1]) upper = sub(upper, plainBox(1.0, 1.4, 7, gx * 11.3, 5.2, gz * LIP_Z));
  }
  upper = sub(upper, plainBox(3, 1.6, 8, -sx * (FW / 2), SOLE + 0.8, 0));
  let sole = inter(columnOuter(FW, FH, FD, FR), plainBox(FW + 2, SOLE, FD + 2, 0, SOLE / 2, 0));
  if (withWindow) {
    const w = cutter(21.4, 23.4, 2, 6, -3).rotateX(Math.PI / 2).translate(0, SOLE / 2, 0);
    sole = sub(sole, w);
  }
  return { upper: upper.geometry, sole: sole.geometry };
}

function pcb(color) {
  return track(new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.2 }));
}
const metal = track(new THREE.MeshStandardMaterial({ color: 0xc8ccd2, roughness: 0.3, metalness: 0.95 }));
const black = track(new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.5, metalness: 0.2 }));
const tabMat = track(new THREE.MeshStandardMaterial({ color: 0xdfe3ea, roughness: 0.5, metalness: 0.05 }));
const bodyMat = track(new THREE.MeshPhysicalMaterial({
  color: 0xf2f4f8, roughness: 0.35, metalness: 0.0, clearcoat: 0.8, clearcoatRoughness: 0.25,
  transparent: true, opacity: 0.35, side: THREE.DoubleSide, depthWrite: false
}));

function bodyMesh(geo) {
  const m = new THREE.Mesh(geo, bodyMat);
  m.castShadow = true;
  return m;
}

const parts = [];
const legend = document.getElementById('legend');
function register(group, base, explode) {
  group.position.copy(base);
  bot.add(group);
  parts.push({ group, base: base.clone(), explode: explode.clone() });
}
function addPart(name, dims, color, group, base, explode) {
  register(group, base, explode);
  const row = document.createElement('div');
  row.innerHTML = `<i style="background:#${color.toString(16).padStart(6, '0')}"></i><span>${name} <b style="opacity:.6;font-weight:400">${dims}</b></span>`;
  legend.appendChild(row);
}
const V = (x, y, z) => new THREE.Vector3(x, y, z);

const HEAD_LIFT = V(0, 32, 0);

function buildBackCap(depth, openW, openH, slot, tabSpecs, blockParent) {
  const half = { x: openW / 2, y: openH / 2 };
  const backIn = -depth / 2 + WALL;
  const zr = -depth / 2 + WALL - 0.2;
  const ze = backIn + 5;
  const len = ze - zr;
  const zc = (zr + ze) / 2;
  const hookZ = ze - 1.0;
  const blockZ = backIn + 1.4;
  const tabs = new THREE.Group();
  for (const [axis, sign, offset, span] of tabSpecs) {
    const horizontal = axis === 'x';
    const h = half[axis];
    const dims = (t, w, l) => (horizontal ? [t, w, l] : [w, t, l]);
    const place = (mesh, radial, z) => {
      if (horizontal) mesh.position.set(sign * radial, offset, z);
      else mesh.position.set(offset, sign * radial, z);
    };
    const plate = new THREE.Mesh(new THREE.BoxGeometry(...dims(1.2, span, len)), tabMat);
    place(plate, h - GAP - 0.7, zc);
    const hook = new THREE.Mesh(new THREE.BoxGeometry(...dims(1.0, span - 1, 1.6)), tabMat);
    place(hook, h + 0.1, hookZ);
    plate.castShadow = hook.castShadow = true;
    tabs.add(plate, hook);
    const block = new THREE.Mesh(new THREE.BoxGeometry(...dims(1.5, span + 1, 2.8)), tabMat);
    place(block, h + 0.75, blockZ);
    block.castShadow = true;
    blockParent.add(block);
  }
  const cap = new THREE.Group();
  cap.add(bodyMesh(buildCap(depth, openW, openH, openW === OPEN_W ? OPEN_R : T_OPEN_R, slot)), tabs);
  return cap;
}

const headGroup = new THREE.Group();
headGroup.add(bodyMesh(buildHead()));
register(
  buildBackCap(HD, OPEN_W, OPEN_H, [ESP_X, ESP_DY + 2.2], [['x', -1, 0, 6], ['x', 1, 0, 6], ['y', 1, 0, 8], ['y', -1, 9, 8]], headGroup),
  V(0, HEAD_CY, 0), V(0, 32, -38)
);
register(headGroup, V(0, HEAD_CY, 0), HEAD_LIFT);

for (const sx of [-1, 1]) {
  const ear = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 4.5, 40), bodyMat);
  ear.rotation.z = Math.PI / 2;
  ear.castShadow = true;
  const g = new THREE.Group();
  g.add(ear);
  register(g, V(sx * (HW / 2 + 1), HEAD_CY + 1, 2), V(sx * 14, 32, 0));
}

{
  const ringShape = new THREE.Shape();
  ringShape.absarc(0, 0, 8.5, 0, Math.PI * 2, false);
  const hole = new THREE.Path();
  hole.absarc(0, 0, 5, 0, Math.PI * 2, true);
  ringShape.holes.push(hole);
  const geo = new THREE.ExtrudeGeometry(ringShape, { depth: 8, bevelEnabled: false, curveSegments: 40 });
  geo.rotateX(-Math.PI / 2);
  const neck = new THREE.Mesh(geo, bodyMat);
  neck.castShadow = true;
  const g = new THREE.Group();
  g.add(neck);
  register(g, V(0, 40, 0), V(0, 16, 0));
}

{
  const torso = new THREE.Group();
  torso.add(bodyMesh(buildTorso()));
  const torsoCap = buildBackCap(TD, T_OPEN_W, T_OPEN_H, null, [['x', -1, 0, 5], ['x', 1, 0, 5], ['y', 1, 0, 8], ['y', -1, 0, 8]], torso);
  register(torso, V(0, TORSO_CY, 0), V(0, 0, 0));
  register(torsoCap, V(0, TORSO_CY, 0), V(0, 0, -38));
}

for (const sx of [-1, 1]) {
  const f = buildFoot(sx);
  const upper = new THREE.Group();
  upper.add(bodyMesh(f.upper));
  register(upper, V(sx * FOOT_X, 0, 0), V(sx * 12, -6, 0));
  const sole = new THREE.Group();
  sole.add(bodyMesh(f.sole));
  for (const gx of [-1, 1]) {
    for (const gz of [-1, 1]) {
      const lip = new THREE.Mesh(new THREE.BoxGeometry(1.2, 3.4, 6), bodyMat);
      lip.position.set(gx * 10.0, SOLE + 1.7, gz * LIP_Z);
      const bump = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.0, 5), bodyMat);
      bump.position.set(gx * 10.9, 5.2, gz * LIP_Z);
      lip.castShadow = bump.castShadow = true;
      sole.add(lip, bump);
    }
  }
  register(sole, V(sx * FOOT_X, 0, 0), V(sx * 12, -22, 0));
}

function limb(a, b, ra, rb, handScale, handPos) {
  const g = new THREE.Group();
  const s1 = new THREE.Mesh(new THREE.SphereGeometry(ra, 32, 24), bodyMat);
  s1.position.copy(a);
  const s2 = new THREE.Mesh(new THREE.SphereGeometry(rb, 32, 24), bodyMat);
  s2.position.copy(b);
  const dir = b.clone().sub(a);
  const len = dir.length();
  const cyl = new THREE.Mesh(new THREE.CylinderGeometry(rb, ra, len, 32, 1, true), bodyMat);
  cyl.position.copy(a).addScaledVector(dir, 0.5);
  cyl.quaternion.setFromUnitVectors(V(0, 1, 0), dir.normalize());
  const hand = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 28), bodyMat);
  hand.scale.copy(handScale);
  hand.position.copy(handPos);
  for (const m of [s1, s2, cyl, hand]) { m.castShadow = true; g.add(m); }
  return g;
}
for (const sx of [-1, 1]) {
  const arm = limb(V(sx * 22, 39, 0.5), V(sx * 31, 26.5, 1), 5.5, 4.2, V(6, 6.5, 5.5), V(sx * 32.5, 22.5, 1.5));
  register(arm, V(0, 0, 0), V(sx * 24, 0, 0));
}

const vibGroup = new THREE.Group();
{
  const padMat = track(new THREE.MeshStandardMaterial({ color: 0xff7a1a, roughness: 0.6, metalness: 0.1 }));
  const pad = slab(21, 23, SOLE, 2, padMat);
  pad.rotation.x = Math.PI / 2;
  pad.position.y = SOLE / 2;
  const body = slab(21, 23, 5, 2, pcb(0x1c6b5a));
  body.rotation.x = Math.PI / 2;
  body.position.y = SOLE + 2.5;
  const motor = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 7, 32), metal);
  motor.rotation.z = Math.PI / 2;
  motor.position.set(0, SOLE + 5 + 3.2, 0);
  motor.castShadow = true;
  vibGroup.add(pad, body, motor);
}
addPart('Vibration module (left foot)', '23 × 21 mm', 0xff7a1a, vibGroup, V(-FOOT_X, 0, 0), V(-12, -22, 0));

const chargerGroup = new THREE.Group();
{
  const board = slab(17, 25, 1.6, 1.5, pcb(0x1f3f8a));
  board.rotation.x = Math.PI / 2;
  board.position.y = 0.8;
  const port = new THREE.Mesh(new RoundedBoxGeometry(9, 3.2, 7.5, 3, 0.9), metal);
  port.position.set(0, 3.2, -25 / 2 + 3.2);
  port.castShadow = true;
  const chip = new THREE.Mesh(new THREE.BoxGeometry(5, 1, 5), black);
  chip.position.set(0, 2.1, 4);
  chargerGroup.add(board, port, chip);
  for (const sx of [-5.5, 5.5]) {
    for (const sz of [-9, 9]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 3.5, 16), tabMat);
      post.position.set(sx, -1.75, sz);
      chargerGroup.add(post);
    }
  }
}
addPart('C-type charging module (right foot)', '25 × 17 mm', 0x1f3f8a, chargerGroup, V(FOOT_X, CHARGER_Y, CHARGER_Z), V(12, -22, 0));

for (const sx of [-1, 1]) {
  const g = new THREE.Group();
  const board = slab(10.7, 14, 1.4, 1.5, pcb(0xd9a21c));
  const chip = new THREE.Mesh(new THREE.BoxGeometry(3, 3, 0.6), black);
  chip.position.z = -0.9;
  g.add(board, chip);
  addPart(sx < 0 ? 'Touch module L (tummy)' : 'Touch module R (tummy)', '10.7 × 14 mm', 0xd9a21c, g, V(sx * 9, TORSO_CY, TD / 2 - WALL - 0.7), V(sx * 8, 0, 34));
}

const accelGroup = new THREE.Group();
{
  const board = slab(20, 15, 1.6, 1.5, pcb(0x7a2fb0));
  const chip = new THREE.Mesh(new THREE.BoxGeometry(4, 4, 1), black);
  chip.position.set(0, 0, 1.3);
  const pins = new THREE.Mesh(new THREE.BoxGeometry(14, 2.5, 2.5), black);
  pins.position.set(0, -5, -1.5);
  accelGroup.add(board, chip, pins);
}
accelGroup.rotation.x = -Math.PI / 2;
addPart('Accelerometer (head)', '20 × 15 mm', 0x7a2fb0, accelGroup, V(0, HEAD_CY + 14, -6), HEAD_LIFT.clone().add(V(0, 22, 0)));

const batteryGroup = new THREE.Group();
{
  const inner = new THREE.Group();
  const body = slab(25, 44, 10, 2.5, track(new THREE.MeshStandardMaterial({ color: 0x4b6fd1, roughness: 0.4, metalness: 0.3 })));
  const tab = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 1.2), black);
  tab.position.set(0, -24, 0);
  inner.add(body, tab);
  inner.rotation.x = -Math.PI / 2;
  batteryGroup.add(inner);
  batteryGroup.rotation.y = Math.PI;
}
addPart('Battery (head)', '25 × 44 × 10 mm', 0x4b6fd1, batteryGroup, V(BAT_X, HEAD_CY + BAT_DY, BAT_Z), HEAD_LIFT.clone().add(V(14, 10, 4)));

const espGroup = new THREE.Group();
{
  const inner = new THREE.Group();
  const board = slab(28.5, 51.5, 1.6, 1.5, pcb(0x14171f));
  const can = new THREE.Mesh(new THREE.BoxGeometry(18, 25.5, 3), metal);
  can.position.set(0, 12, 2.3);
  can.castShadow = true;
  const usb = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 2.8), metal);
  usb.position.set(0, -24.5, 2.2);
  inner.add(board, can, usb);
  const pinsMat = track(new THREE.MeshStandardMaterial({ color: 0xd9b45a, metalness: 0.9, roughness: 0.35 }));
  for (const sx of [-1, 1]) {
    const strip = new THREE.Mesh(new THREE.BoxGeometry(2.5, 44, 2.5), black);
    strip.position.set(sx * 12.6, -2, -1.6);
    const gold = new THREE.Mesh(new THREE.BoxGeometry(0.7, 44, 0.7), pinsMat);
    gold.position.set(sx * 12.6, -2, -3.1);
    inner.add(strip, gold);
  }
  inner.rotation.x = -Math.PI / 2;
  espGroup.add(inner);
  espGroup.rotation.y = Math.PI;
  const floorDy = -HH / 2 + WALL - ESP_DY;
  for (const px of [-8, 8]) {
    for (const pz of [-20, 20]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, -floorDy - 0.8, 16), tabMat);
      post.position.set(px, (floorDy - 0.8) / 2, pz);
      espGroup.add(post);
    }
  }
}
addPart('ESP32 module (head)', '28.5 × 51.5 mm', 0x3a3f4d, espGroup, V(ESP_X, HEAD_CY + ESP_DY, ESP_Z), HEAD_LIFT.clone().add(V(-14, 12, -10)));

const screenCanvas = document.createElement('canvas');
screenCanvas.width = 700;
screenCanvas.height = 370;
const sctx = screenCanvas.getContext('2d');
const screenTex = new THREE.CanvasTexture(screenCanvas);
screenTex.colorSpace = THREE.SRGBColorSpace;
screenTex.anisotropy = 8;

function drawFace(t) {
  const w = screenCanvas.width, h = screenCanvas.height;
  sctx.fillStyle = '#04080c';
  sctx.fillRect(0, 0, w, h);
  const blink = (t % 4) > 3.85 ? 0.12 : 1;
  const look = Math.sin(t * 0.8) * 14;
  sctx.fillStyle = '#4ff0ff';
  sctx.shadowColor = '#4ff0ff';
  sctx.shadowBlur = 24;
  for (const ex of [w * 0.3, w * 0.7]) {
    const ew = 100, eh = 130 * blink;
    sctx.beginPath();
    sctx.roundRect(ex - ew / 2 + look, h * 0.45 - eh / 2, ew, eh, 34);
    sctx.fill();
  }
  sctx.shadowBlur = 0;
  screenTex.needsUpdate = true;
}
drawFace(0);

const screenGroup = new THREE.Group();
const displayMat = track(new THREE.MeshBasicMaterial({ map: screenTex }));
{
  const board = slab(35, 32.2, 1.6, 2, pcb(0x101216));
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(35, 18.5), displayMat);
  glass.position.set(0, 3.5, 0.85);
  const flex = new THREE.Mesh(new THREE.BoxGeometry(14, 2.5, 0.4), track(new THREE.MeshStandardMaterial({ color: 0xc78a2c, roughness: 0.6 })));
  flex.position.set(0, -14.5, -0.8);
  screenGroup.add(board, glass, flex);
}
addPart('Screen module (head)', '35 × 32.2 mm (display 35 × 18.5)', 0x4ff0ff, screenGroup, V(0, HEAD_CY + SCREEN_DY, FRONT_IN - 0.9), HEAD_LIFT.clone().add(V(0, 0, 34)));


const wireGroup = new THREE.Group();
bot.add(wireGroup);
const WIRE_COLORS = [0xe23b3b, 0x1b1b1f, 0xf2c200, 0x2fbf71];
const WIRE_SPREAD = [[0.32, 0], [-0.32, 0], [0, 0.32], [0, -0.32]];
function bundle(points, count, offset = [0, 0]) {
  for (let i = 0; i < count; i++) {
    const spread = count === 2 ? [[0.25, 0], [-0.25, 0]][i] : WIRE_SPREAD[i];
    const pts = points.map(p => V(p[0] + offset[0] + spread[0], p[1], p[2] + offset[1] + spread[1]));
    const curve = new THREE.CatmullRomCurve3(pts, false, 'centripetal');
    const mat = track(new THREE.MeshStandardMaterial({ color: WIRE_COLORS[i], roughness: 0.6 }));
    wireGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.26, 6, false), mat));
  }
}
function legendNote(text) {
  const row = document.createElement('div');
  row.innerHTML = `<i style="background:linear-gradient(90deg,#e23b3b 25%,#1b1b1f 25% 50%,#f2c200 50% 75%,#2fbf71 75%)"></i><span>${text}</span>`;
  legend.appendChild(row);
}

const NECK_UP = [[0.8, 48, -1], [0, 45, 0], [0, 41, 0], [0, 36, 0]];
bundle([[-0.6, 55, 14], [-0.6, 50, 6], ...NECK_UP, [-4, 31, 13], [-9, 29.5, 14.2]], 4, [-1.6, 0]);
bundle([[-0.6, 55, 10], [-0.6, 50, 4], ...NECK_UP, [4, 31, 13], [9, 29.5, 14.2]], 4, [1.6, 0]);
bundle([[-0.6, 55, 6], [-0.6, 50, 2], ...NECK_UP, [-3, 28, 2], [-9, 22, 1], [-11.5, 18, 0.8], [-11.5, 15, 0.8], [-12, 10.5, 1], [-13.5, 8.5, 3]], 4, [0, -1.6]);
bundle([[-0.6, 55, 2], [-0.6, 50, 0], ...NECK_UP, [3, 28, 1], [9, 22, 1], [11.5, 18, 0.8], [11.5, 15, 0.8], [13, 10.5, 2], [16, 8.8, 5]], 4, [0, 1.6]);
bundle([[0, 44, 1.5], [4, 49.5, -8], [10, 51, -18], [14.5, 53, -21]], 2, [0, 1.6]);
bundle([[14.5, 53, -21], [8, 51, -23.5], [-6, 51, -24.5], [-12, 55, -23]], 2);
bundle([[-8, 59, 24], [-6, 62, 25.5], [-4, 64, 26]], 4);
bundle([[-12, 62.5, -6], [-8, 70, -6], [-3, 78, -6], [0, 80, -6]], 4);
legendNote('4 wires per module: screen, accelerometer, touch L, touch R, vibration, charger');
legendNote('Neck carries 16 wires (touch 8, vibration 4, charger 4)');
legendNote('Each foot passage carries 4 wires; ESP32 end takes 24 wires in total');

const opacity = document.getElementById('opacity');
const wiresBox = document.getElementById('wires');
const explode = document.getElementById('explode');
const cut = document.getElementById('cut');
const vib = document.getElementById('vib');
const spin = document.getElementById('spin');
const opv = document.getElementById('opv');
const exv = document.getElementById('exv');

function applyOpacity() {
  const v = opacity.value / 100;
  opv.textContent = opacity.value + '%';
  const solid = v >= 0.999;
  bodyMat.opacity = v;
  bodyMat.transparent = !solid;
  bodyMat.depthWrite = solid;
  bodyMat.needsUpdate = true;
}
applyOpacity();
applyClip(false);
opacity.addEventListener('input', applyOpacity);
explode.addEventListener('input', () => { exv.textContent = explode.value + '%'; });
cut.addEventListener('change', () => applyClip(cut.checked));
spin.addEventListener('change', () => { controls.autoRotate = spin.checked; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
function tick() {
  const t = clock.getElapsedTime();
  const e = explode.value / 100;
  for (const p of parts) p.group.position.copy(p.base).addScaledVector(p.explode, e);
  wireGroup.visible = wiresBox.checked && e < 0.02;
  const sh = vib.checked ? 0.15 : 0;
  bot.position.set(Math.sin(t * 90) * sh, 0, Math.cos(t * 83) * sh);
  drawFace(t);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
